name: Deploy

# Déploiement production coordonné sur push main.
# Ordre garanti : Convex d'abord, puis les applications web en parallèle.
# Une application ne part jamais si le déploiement Convex a échoué.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  GCP_REGION: europe-west1
  AR_REPO: identite-ga

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      admin: ${{ steps.filter.outputs.admin }}
      controller: ${{ steps.filter.outputs.controller }}
      developer: ${{ steps.filter.outputs.developer }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'packages/backend/convex/**'
              - '!packages/backend/convex/_generated/**'
              - 'packages/backend/package.json'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/deploy.yml'
            admin:
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
              - '.github/workflows/deploy.yml'
              - 'packages/ui/**'
              - 'packages/backend/**'
              - 'packages/eslint-config/**'
              - 'packages/typescript-config/**'
              - 'apps/admin/**'
            controller:
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
              - '.github/workflows/deploy.yml'
              - 'packages/ui/**'
              - 'packages/backend/**'
              - 'packages/eslint-config/**'
              - 'packages/typescript-config/**'
              - 'apps/controller/**'
            developer:
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
              - '.github/workflows/deploy.yml'
              - 'packages/ui/**'
              - 'packages/backend/**'
              - 'packages/eslint-config/**'
              - 'packages/typescript-config/**'
              - 'packages/sdk/**'
              - 'apps/developer/**'
            web:
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
              - '.github/workflows/deploy.yml'
              - 'packages/ui/**'
              - 'packages/backend/**'
              - 'packages/eslint-config/**'
              - 'packages/typescript-config/**'
              - 'apps/web/**'

  deploy-convex:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Tests backend
        run: bun run --filter=@repo/backend test:once
      - name: Sync Web Push configuration
        working-directory: packages/backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          test -n "$VAPID_PUBLIC_KEY"
          test -n "$VAPID_PRIVATE_KEY"
          bunx convex env set VAPID_PUBLIC_KEY "$VAPID_PUBLIC_KEY"
          bunx convex env set VAPID_PRIVATE_KEY "$VAPID_PRIVATE_KEY"
      - name: Deploy Convex
        working-directory: packages/backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: bunx convex deploy --yes

  deploy-admin:
    needs: [changes, deploy-convex]
    if: >-
      always() &&
      needs.changes.outputs.admin == 'true' &&
      needs.deploy-convex.result != 'failure' &&
      needs.deploy-convex.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SERVICE: admin
    steps:
      - uses: actions/checkout@v5
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE }}:${{ github.sha }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE }}:latest
          cache-from: type=gha,scope=${{ env.SERVICE }}
          cache-to: type=gha,scope=${{ env.SERVICE }},mode=max
          build-args: NEXT_PUBLIC_CONVEX_URL=${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE }}:${{ github.sha }}
          env_vars: CONVEX_SITE_URL=${{ secrets.CONVEX_SITE_URL }}
          flags: --allow-unauthenticated --port=8080

  deploy-controller:
    needs: [changes, deploy-convex]
    if: >-
      always() &&
      needs.changes.outputs.controller == 'true' &&
      needs.deploy-convex.result != 'failure' &&
      needs.deploy-convex.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SERVICE: controller
    steps:
      - uses: actions/checkout@v5
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/controller/Dockerfile
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE }}:${{ github.sha }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE }}:latest
          cache-from: type=gha,scope=${{ env.SERVICE }}
          cache-to: type=gha,scope=${{ env.SERVICE }},mode=max
          build-args: NEXT_PUBLIC_CONVEX_URL=${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE }}:${{ github.sha }}
          env_vars: CONVEX_SITE_URL=${{ secrets.CONVEX_SITE_URL }}
          flags: --allow-unauthenticated --port=8080

  deploy-developer:
    needs: [changes, deploy-convex]
    if: >-
      always() &&
      needs.changes.outputs.developer == 'true' &&
      needs.deploy-convex.result != 'failure' &&
      needs.deploy-convex.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SERVICE: developer
    steps:
      - uses: actions/checkout@v5
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/developer/Dockerfile
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE }}:${{ github.sha }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE }}:latest
          cache-from: type=gha,scope=${{ env.SERVICE }}
          cache-to: type=gha,scope=${{ env.SERVICE }},mode=max
          build-args: NEXT_PUBLIC_CONVEX_URL=${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE }}:${{ github.sha }}
          env_vars: CONVEX_SITE_URL=${{ secrets.CONVEX_SITE_URL }}
          flags: --allow-unauthenticated --port=8080

  deploy-web:
    needs: [changes, deploy-convex]
    if: >-
      always() &&
      needs.changes.outputs.web == 'true' &&
      needs.deploy-convex.result != 'failure' &&
      needs.deploy-convex.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SERVICE: web
    steps:
      - uses: actions/checkout@v5
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE }}:${{ github.sha }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE }}:latest
          cache-from: type=gha,scope=${{ env.SERVICE }}
          cache-to: type=gha,scope=${{ env.SERVICE }},mode=max
          build-args: NEXT_PUBLIC_CONVEX_URL=${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE }}:${{ github.sha }}
          env_vars: CONVEX_SITE_URL=${{ secrets.CONVEX_SITE_URL }}
          flags: --allow-unauthenticated --port=8080
