name: Deploy KYC Inference

on:
  push:
    branches: [main]
    paths:
      - "services/kyc-inference/**"
      - ".github/workflows/deploy-kyc-inference.yml"
  workflow_dispatch:

concurrency:
  group: deploy-kyc-inference-main
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  GCP_REGION: europe-west9
  AR_REPO: identite-ga
  SERVICE: kyc-inference

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/kyc-inference/requirements-test.txt

      - name: Run service tests
        working-directory: services/kyc-inference
        run: |
          python -m venv /tmp/kyc-inference-ci
          . /tmp/kyc-inference-ci/bin/activate
          pip install --disable-pip-version-check -r requirements-test.txt
          pytest

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: services/kyc-inference
          file: services/kyc-inference/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE }}:${{ github.sha }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE }}:latest
          cache-from: type=gha,scope=${{ env.SERVICE }}
          cache-to: type=gha,scope=${{ env.SERVICE }},mode=max

      - id: deploy
        name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          service: ${{ env.SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE }}:${{ github.sha }}
          env_vars: |
            KYC_TESSERACT_LANG=fra+eng
            ALLOWED_ASSET_HOST_SUFFIXES=.convex.cloud\,.convex.site
          env_vars_update_strategy: overwrite
          secrets: |
            KYC_INFERENCE_SECRET=kyc-inference-secret:latest
          secrets_update_strategy: overwrite
          timeout: 120s
          flags: >-
            --no-allow-unauthenticated
            --port=8080
            --memory=4Gi
            --cpu=2
            --concurrency=4
            --min-instances=0
            --max-instances=4
            --cpu-boost
            --service-account=kyc-inference-runtime@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Show deployed service URL
        run: echo "KYC inference deployed to ${{ steps.deploy.outputs.url }}"
