<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#009e60" />
    <title>Hors connexion · Identité Numérique</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8faf8;
        color: #152019;
      }
      main {
        width: min(88vw, 440px);
        padding: 32px;
        border: 1px solid #dce5dd;
        border-radius: 20px;
        background: white;
        box-shadow: 0 12px 40px rgba(17, 51, 30, 0.08);
      }
      .icon {
        width: 52px;
        height: 52px;
        display: grid;
        place-items: center;
        border-radius: 14px;
        background: #009e60;
        color: white;
        font-size: 24px;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 24px;
      }
      p {
        margin: 0;
        line-height: 1.55;
        color: #647067;
      }
      button {
        margin-top: 24px;
        border: 0;
        border-radius: 10px;
        padding: 11px 18px;
        background: #009e60;
        color: white;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #09110c;
          color: #eef5ef;
        }
        main {
          background: #111a14;
          border-color: #27372c;
        }
        p {
          color: #aab7ad;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">✓</div>
      <h1>Vous êtes hors connexion</h1>
      <p>
        Reconnectez-vous à Internet pour accéder à votre identité numérique et à
        vos rendez-vous.
      </p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
