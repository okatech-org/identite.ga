<script type="text/babel">
function App() {
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "dark": false
  }/*EDITMODE-END*/;
  const [tweaks, setTweak] = window.useTweaks(TWEAK_DEFAULTS);
  const t = window.idnTheme(tweaks.dark);

  React.useEffect(() => {
    document.body.classList.toggle('idn-dark', tweaks.dark);
  }, [tweaks.dark]);

  return (
    <>
      <DesignCanvas>
        <DCSection id="native-launch" title="App mobile — Lancement & onboarding" subtitle="Splash biométrique, carousel 4 slides, hub d'authentification.">
          <DCArtboard id="n-launcher" label="Splash · Face ID"     width={360} height={740}><NativeApp t={t} screen="launcher"/></DCArtboard>

        </DCSection>

          <DCArtboard id="n-si-b"       label="03 · Variation B · Builder"     width={360} height={740}><NativeApp t={t} screen="signup-idn-b"/></DCArtboard>
          <DCArtboard id="n-si-c"       label="03 · Variation C · Carte preview" width={360} height={740}><NativeApp t={t} screen="signup-idn-c"/></DCArtboard>

          <DCArtboard id="n-si-pwd"     label="04 · Mot de passe"             width={360} height={740}><NativeApp t={t} screen="signup-pwd-idn"/></DCArtboard>
          <DCArtboard id="n-si-phone"   label="05 · Téléphone"               width={360} height={740}><NativeApp t={t} screen="signup-phone"/></DCArtboard>
          <DCArtboard id="n-si-otp"     label="06 · Vérification numéro"     width={360} height={740}><NativeApp t={t} screen="signup-sms-otp"/></DCArtboard>

        </DCSection>

          <DCArtboard id="ica-home"   label="Liste"              width={360} height={740}><NativeApp t={t} screen="icarte-home"/></DCArtboard>
          <DCArtboard id="ica-empty"  label="Vide"               width={360} height={740}><NativeApp t={t} screen="icarte-empty"/></DCArtboard>

          <DCArtboard id="ica-custom" label="Personnalisée"      width={360} height={740}><NativeApp t={t} screen="icarte-custom"/></DCArtboard>
        </DCSection>

        <DCSection id="native-iboite" title="App mobile — iBoîte (boîte aux lettres souveraine)" subtitle="3 comptes (Personnel/Pro/Asso), 3 sections (Courriers/Colis/eMails). Courriers physiques numérisés avec rendu A4, point relais idn.ga avec QR.">
          <DCArtboard id="ibo-cou"  label="Courriers"         width={360} height={740}><NativeApp t={t} screen="iboite-courriers"/></DCArtboard>
          <DCArtboard id="ibo-det"  label="Courrier (A4)"     width={360} height={740}><NativeApp t={t} screen="iboite-courrier"/></DCArtboard>
          <DCArtboard id="ibo-acc"  label="Switch compte"     width={360} height={740}><NativeApp t={t} screen="iboite-accounts"/></DCArtboard>

        </DCSection>

          <DCArtboard id="ido-home"    label="Dossiers"           width={360} height={740}><NativeApp t={t} screen="idoc-home"/></DCArtboard>
          <DCArtboard id="ido-conf"    label="Confidentiel"       width={360} height={740}><NativeApp t={t} screen="idoc-home-conf"/></DCArtboard>
          <DCArtboard id="ido-fold"    label="Dossier Identité"   width={360} height={740}><NativeApp t={t} screen="idoc-folder"/></DCArtboard>
          <DCArtboard id="ido-fb"      label="Dossier · blur"     width={360} height={740}><NativeApp t={t} screen="idoc-folder-conf"/></DCArtboard>

          <DCArtboard id="ido-add3"    label="Ajout 3/3 · succès" width={360} height={740}><NativeApp t={t} screen="idoc-add-success"/></DCArtboard>
          <DCArtboard id="ido-req"     label="Demander"           width={360} height={740}><NativeApp t={t} screen="idoc-request"/></DCArtboard>
        </DCSection>

        <DCSection id="native-notif-v2" title="App mobile — Centre de notifications" subtitle="Filtres Tout / Non lu / Sécurité / Documents. Groupes Aujourd'hui & Hier. CTA par notification.">
          <DCArtboard id="nf-all"  label="Toutes"            width={360} height={740}><NativeApp t={t} screen="notif-center"/></DCArtboard>
          <DCArtboard id="nf-un"   label="Non lues"          width={360} height={740}><NativeApp t={t} screen="notif-unread"/></DCArtboard>
          <DCArtboard id="nf-sec"  label="Sécurité"          width={360} height={740}><NativeApp t={t} screen="notif-security"/></DCArtboard>
          <DCArtboard id="nf-doc"  label="Documents"         width={360} height={740}><NativeApp t={t} screen="notif-document"/></DCArtboard>
          <DCArtboard id="nf-read" label="Tout lu"           width={360} height={740}><NativeApp t={t} screen="notif-allread"/></DCArtboard>
        </DCSection>

          <DCArtboard id="icv-empty"     label="01 · CV vide (onboarding)"   width={360} height={740}><NativeApp t={t} screen="icv-empty"/></DCArtboard>
          <DCArtboard id="icv-home"      label="02 · Accueil iCV"            width={360} height={740}><NativeApp t={t} screen="icv-home"/></DCArtboard>

          <DCArtboard id="n-set-sec"    label="Sécurité"              width={360} height={740}><NativeApp t={t} screen="set-security"/></DCArtboard>
