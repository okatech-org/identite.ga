<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<title>Parcours Notifications — IDN</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  html, body { margin: 0; padding: 0; font-family: "IBM Plex Sans", system-ui, sans-serif; }
  body { background: #f0eee9; min-height: 100vh; }
  body.idn-dark { background: #0a0d0a; }
  * { box-sizing: border-box; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="idn-tokens.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="idn-mobile.jsx"></script>
<script type="text/babel" src="idn-desktop.jsx"></script>
<script type="text/babel" src="idn-citizen-web.jsx"></script>
<script type="text/babel" src="idn-citizen-extras.jsx"></script>
<script type="text/babel" src="idn-mobile-icarte.jsx"></script>
<script type="text/babel" src="idn-mobile-iboite.jsx"></script>
<script type="text/babel" src="idn-mobile-idocument.jsx"></script>
<script type="text/babel" src="idn-mobile-notif.jsx"></script>
<script type="text/babel" src="idn-mobile-icv.jsx"></script>
<script type="text/babel" src="idn-web-icarte.jsx"></script>
<script type="text/babel" src="idn-web-iboite.jsx"></script>
<script type="text/babel" src="idn-web-idoc.jsx"></script>
<script type="text/babel" src="idn-web-notif.jsx"></script>
<script type="text/babel" src="idn-web-icv.jsx"></script>
<script type="text/babel" src="idn-native-app.jsx"></script>
<script type="text/babel" src="idn-signup-idn.jsx"></script>
<script type="text/babel" src="parcours-shell.jsx"></script>

<script type="text/babel">
const STEPS = [
  { id: '01', label: 'Toutes les notifications',     desc: 'Centre de notifications complet. Groupées par jour, filtres en haut.',                                                    mobile: 'notif-center',      web: 'all' },
  { id: '02', label: 'Non lues',                     desc: 'Filtre : uniquement les notifications non lues.',                                                                          mobile: 'notif-unread',      web: 'unread' },
  { id: '03', label: 'Sécurité',                     desc: 'Filtre Sécurité : nouvelles connexions, demandes de consentement OIDC, tentatives suspectes.',                            mobile: 'notif-security',    web: 'security' },
  { id: '04', label: 'Documents',                    desc: 'Filtre Documents : courriers reçus, cachets, signatures demandées.',                                                       mobile: 'notif-document',    web: 'document' },
  { id: '05', label: 'État vide · tout lu',          desc: 'État final lorsque tout a été lu : illustration positive, accès rapide aux paramètres.',                                  mobile: 'notif-allread',     web: null },
];

function App() {
  return (
    <ParcoursShell
      title="Notifications"
      subtitle="Centre de notifications"
      storageKey="idn-parcours-notif"
      steps={STEPS}
      renderMobile={(screen, t) => <NativeApp t={t} screen={screen}/>}
      renderWeb={(screen, t) => <NotifWeb t={t} screen={screen}/>}
    />
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
