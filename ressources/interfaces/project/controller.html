<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<title>IDN — Espace contrôleur d'identité</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  html, body { margin: 0; padding: 0; font-family: "IBM Plex Sans", system-ui, sans-serif; }
  body { background: #f0eee9; }
  body.idn-dark { background: #0a0d0a; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="idn-tokens.jsx"></script>
<script type="text/babel" src="idn-desktop.jsx"></script>

<script type="text/babel">
function App() {
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "dark": false
  }/*EDITMODE-END*/;
  const [tweaks, setTweak] = window.useTweaks(TWEAK_DEFAULTS);
  const t = window.idnTheme(tweaks.dark);

  React.useEffect(() => {
    document.body.classList.toggle('idn-dark', tweaks.dark);
  }, [tweaks.dark]);

  return (
    <>
      <DesignCanvas>
        <DCSection id="controller" title="Espace Contrôleur d'Identité" subtitle="Pour les agents assermentés (police, douanes, administrations).">
          <DCArtboard id="ctrl-queue"   label="01 · File de demandes KYC" width={1180} height={760}><ControllerConsole t={t} initialTab="queue"/></DCArtboard>
          <DCArtboard id="ctrl-scan"    label="02 · Scanner identité"     width={1180} height={760}><ControllerConsole t={t} initialTab="scan"/></DCArtboard>
          <DCArtboard id="ctrl-verify"  label="03 · Vérifier signature"   width={1180} height={760}><ControllerConsole t={t} initialTab="verify"/></DCArtboard>
          <DCArtboard id="ctrl-history" label="04 · Historique contrôles" width={1180} height={760}><ControllerConsole t={t} initialTab="history"/></DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel title="Tweaks">
        <TweakSection title="Apparence">
          <TweakToggle label="Mode sombre" value={tweaks.dark} onChange={(v) => setTweak('dark', v)}
            description="Inverse les neutres pour l'espace contrôleur."/>
        </TweakSection>
        <TweakSection title="Retour au hub">
          <a href="idn.html" style={{ display: 'inline-flex', alignItems: 'center', gap: 6, padding: '8px 14px', borderRadius: 9999, background: '#0E7C3A', color: '#fff', textDecoration: 'none', fontSize: 12, fontWeight: 600 }}>← Tous les parcours</a>
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
